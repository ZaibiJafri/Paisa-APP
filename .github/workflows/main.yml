name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare app
        run: |
          mkdir -p www
          if [ -f index.html ]; then cp index.html www/index.html; fi
          test -f www/index.html || { echo "index.html repository ke main page par nahi mili"; exit 1; }
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor/cli@6
          echo '{"appId":"com.paisaplan.app","appName":"Paisa Plan","webDir":"www"}' > capacitor.config.json
      - run: npx cap add android
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Paisa-Plan-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
